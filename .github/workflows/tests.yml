name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The package's dependencies are declared in pyproject.toml;
          # requirements.txt is the Docker environment.
          cache-dependency-path: pyproject.toml
      - name: Install system libraries for opencv-python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install through the declared extras so a broken extra fails CI;
          # matplotlib and pillow are only needed by the tests.
          python -m pip install -e ".[dev,arrow,tiledb,image,ros]" matplotlib pillow
      - name: Validate release metadata
        run: python scripts/check_release.py
      - name: Run tests
        run: python -m pytest -q --strict-config --strict-markers tests/

  base-install:
    name: NumPy-only install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel and install it without optional extras
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}" pytest
      - name: Import and CLI smoke test
        # Outside the checkout, so the installed wheel is what gets imported.
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import arraydataengine, ArrayDataEngine
          assert "site-packages" in arraydataengine.__file__, arraydataengine.__file__
          assert ArrayDataEngine.__version__ == arraydataengine.__version__
          PY
          ade --help >/dev/null
          ade demo -o "$RUNNER_TEMP/ade_demo" --duration 1
      - name: Run the tests that need no extras against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q --strict-config --strict-markers -p no:cacheprovider \
            "$GITHUB_WORKSPACE/tests/test_fixes_cli.py" "$GITHUB_WORKSPACE/tests/test_fixes2_cli.py"

  dist:
    name: Build and check distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build wheel and sdist from source
        run: python -m build
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist
      - name: Install the built wheel into a fresh virtual environment
        working-directory: ${{ runner.temp }}
        run: |
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install --upgrade pip
          wheel-venv/bin/python -m pip install --only-binary=:all: "${wheels[0]}"
      - name: Smoke test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          wheel-venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import arraydataengine
          import ArrayDataEngine
          assert "wheel-venv" in arraydataengine.__file__, arraydataengine.__file__
          assert arraydataengine.__version__ == metadata.version("arraydataengine")
          assert arraydataengine.DataBuffer is ArrayDataEngine.DataBuffer
          assert arraydataengine.DataSources is ArrayDataEngine.DataSources
          assert importlib.util.find_spec("ade") is None
          scripts = [ep for ep in metadata.entry_points(group="console_scripts") if ep.name == "ade"]
          assert [ep.value for ep in scripts] == ["arraydataengine.cli:main"], scripts
          PY
          wheel-venv/bin/ade --help >/dev/null
          wheel-venv/bin/ade demo -o ade_demo --duration 1
          test -s ade_demo/viewer.html
