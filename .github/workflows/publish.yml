name: release

# A matching v* tag is the only production publication trigger. Manual
# dispatches build and verify, with an explicit opt-in for TestPyPI only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish-to-testpypi:
        description: Publish the verified artifacts to TestPyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and inspect distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Validate source metadata for a release
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Validate source metadata for a dry run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_release.py
      - name: Build wheel and sdist from source
        run: python -m build
      - name: Validate distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist
      - name: Store the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Full suite on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # opencv-python-headless instead of the [image] extra: CI has no libGL
          python -m pip install -e ".[dev,tiledb,arrow]" \
            opencv-python-headless scipy matplotlib pillow scikit-image rosbags
      - name: Run the full test suite
        run: python -m pytest -q --strict-config --strict-markers tests/

  verify:
    name: Smoke test wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Install the built wheel
        working-directory: ${{ runner.temp }}
        run: |
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: "${wheels[0]}"
      - name: Exercise canonical imports and CLI
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import arraydataengine
          import ArrayDataEngine
          assert arraydataengine.__version__ == metadata.version("arraydataengine")
          assert arraydataengine.DataBuffer is ArrayDataEngine.DataBuffer
          assert arraydataengine.DataSources is ArrayDataEngine.DataSources
          assert arraydataengine.Visualizer is ArrayDataEngine.Visualizer
          assert arraydataengine.describe_topic is ArrayDataEngine.describe_topic
          assert importlib.util.find_spec("ade") is None
          PY
          ade --help >/dev/null

  publish:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/arraydataengine
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-testpypi:
    name: Publish verified distributions to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish-to-testpypi
    needs: [build, test, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arraydataengine
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
