[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arraydataengine"
version = "0.3.0"
authors = [
  { name="Alex Moran", email="salsicha@gmail.com" },
]
description = "NumPy-first streaming engine for heterogeneous robotics sensor data: ROS bags, image sequences, DEM tiles, and TileDB-backed buffers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "robotics",
    "sensor-data",
    "point-cloud",
    "rosbag",
    "ros2",
    "numpy",
    "tiledb",
    "dem",
    "lidar",
]
dependencies = [
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
arrow = [
    "pyarrow",
]
dem = [
    "rasterio",
    "requests",
]
dev = [
    "pytest",
]
image = [
    "opencv-python",
    "scikit-image",
    "scipy",
]
ml = [
    "pycocotools",
    "tensorboard",
    "torch",
    "torchvision",
    "ultralytics",
    "wandb",
]
notebook = [
    "jupyterlab",
]
ros = [
    "navpy",
    "rosbags",
    "rosbags-dataframe",
    "rosbags-image",
    "transforms3d",
]
tiledb = [
    "tiledb",
    "tiledb-ml",
]
visualization = [
    "ipython",
    "matplotlib",
    "open3d",
    "Pillow",
]

[project.scripts]
ade = "ade.cli:main"

[project.urls]
Homepage = "https://github.com/salsicha/ArrayDataEngine"
Repository = "https://github.com/salsicha/ArrayDataEngine"
Issues = "https://github.com/salsicha/ArrayDataEngine/issues"
Changelog = "https://github.com/salsicha/ArrayDataEngine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ade*", "ArrayDataEngine*"]
